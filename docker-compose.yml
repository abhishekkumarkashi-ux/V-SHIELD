version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vshield-backend
    ports:
      - "8000:8000"
    environment:
      - SAMPLE_RATE=16000
      - WINDOW_SIZE=64600
      - HOP_SIZE=8000
      - VAD_MARGIN_SEC=0.3
      - RISK_ALPHA=0.70
    volumes:
      - ./backend/app:/app/app
      - vshield-weights:/app/app/weights
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vshield-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vshield-weights:
