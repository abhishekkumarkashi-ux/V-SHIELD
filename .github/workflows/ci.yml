name: V-SHIELD CI Pipeline & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Lint & Code Style Quality Gate
  # ============================================================================
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Quality Gate Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black flake8

      - name: Run Ruff Linter
        run: ruff check backend/app tests/

      - name: Check Code Formatting (Black)
        run: black --check backend/app tests/

      - name: Run Flake8 Linter
        run: flake8 backend/app tests/

  # ============================================================================
  # Job 2: Backend Automated Tests & Coverage
  # ============================================================================
  test-backend:
    name: Backend Automated Tests & Coverage
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Audio System Headers & Codecs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg

      - name: Install PyTorch (Headless CPU Runner Optimized)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite with Coverage Enforcement (>=80%)
        env:
          PYTHONPATH: backend
          PYTHONIOENCODING: utf-8
        run: |
          pytest tests/ -v --cov=backend/app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ============================================================================
  # Job 3: Frontend Lint, Typecheck & Production Build
  # ============================================================================
  test-frontend:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Frontend (TypeScript Typecheck)
        run: npm run lint

      - name: Build Frontend Application (Vite Bundler)
        run: npm run build
